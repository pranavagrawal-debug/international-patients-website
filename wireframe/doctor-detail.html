<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor | TRUE ARTIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* EDIT HERE: brand colours and fonts */
:root{--gold:#c59d5f;--brown:#aa6d2b;--bg:#f8f7f4;--ink:#1d1d1b;--red:#b3472d;--serif:'Marcellus',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 64px;height:72px;background:#fff;border-bottom:1px solid #e6e1d8}
.top nav{display:flex;gap:28px;font:500 14px var(--sans)}
.logo{font:400 22px var(--serif);letter-spacing:.06em}
.btn{display:inline-block;padding:13px 24px;border:1.5px solid var(--gold);border-radius:999px;font:600 13px var(--sans);text-align:center;cursor:pointer}
.btn.f{background:var(--gold);color:#fff}
.btn:hover{opacity:.88}
.crumb{padding:28px 64px 0;font-size:13px;color:#777}
.crumb a{color:var(--brown)}
.main{display:grid;grid-template-columns:360px 1fr;gap:48px;padding:28px 64px 80px;align-items:start}
.photo{width:100%;aspect-ratio:1/1;border-radius:16px;border:3px solid var(--gold);background:#e9dcc6;overflow:hidden;display:flex;align-items:center;justify-content:center;font:400 72px var(--serif);color:var(--gold)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:top}
h1{font:400 44px/1.15 var(--serif);margin:0 0 14px}
.deg{color:var(--red);font-size:14px;line-height:1.6;margin:0 0 10px;font-weight:500}
.role{font-size:17px;margin:0 0 28px}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px}
.box{background:#fff;border-radius:14px;padding:22px 26px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.box h3{font:400 20px var(--serif);margin:0 0 8px}
.box p{margin:0;line-height:1.7;font-size:15px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 24px}.stat{background:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.stat b{display:block;font:400 26px var(--serif);color:var(--brown)}.stat span{font-size:12px;color:#777}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{border:1.5px solid var(--gold);border-radius:999px;padding:6px 14px;font:600 12px var(--sans);background:#fbf4e6}
.box ul{margin:0;padding-left:20px;line-height:1.8;font-size:15px;columns:2}@media(max-width:800px){.box ul{columns:1}}
footer{padding:28px 64px;background:#1d1d1b;color:#bbb;font-size:13px}
@media(max-width:800px){.top{padding:0 20px}.top nav{display:none}.crumb{padding:20px 20px 0}.main{grid-template-columns:1fr;padding:20px 20px 60px;gap:28px}h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <a href="index.html" class="logo">TRUE ARTIS</a>
  <nav><a href="treatments.html">Treatments</a><a href="doctors.html">Doctors</a><a href="price-calculator.html">Price calculator</a><a href="plan-your-visit.html">Plan your visit</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a></nav>
  <a href="contact.html" class="btn f">WhatsApp / Send an enquiry</a>
</div>
<div class="crumb"><a href="index.html">Home</a> / <a href="doctors.html">Doctors</a> / <span id="crumbName">Doctor</span></div>
<div class="main" id="main"></div>
<footer>© TRUE ARTIS · International patient services</footer>
</div>
<script src="/assets/doctors.js"></script>
<script>
(function(){
  var slug=new URLSearchParams(location.search).get('d');
  var list=window.DOCTORS||[];
  var d=list.filter(function(x){return x.slug===slug})[0];
  var m=document.getElementById('main');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  if(!d){
    m.innerHTML='<div><h1>Doctor not found</h1><p class="role">Please choose a doctor from the list.</p><a class="btn f" href="doctors.html">See all doctors</a></div>';
    return;
  }
  document.title=d.name+' | TRUE ARTIS';
  document.getElementById('crumbName').textContent=d.name;
  var initials=d.name.replace('Dr. ','').split(' ').map(function(w){return w[0]}).join('');
  var html='<div class="photo" id="ph">'+initials+'</div><div>'
   +'<h1>'+esc(d.name)+'</h1>'
   +'<p class="deg">'+esc(d.degrees)+'</p>'
   +'<p class="role">'+esc(d.role)+'</p>'
   +'<div class="stats">'+(d.exp?'<div class="stat"><b>'+esc(d.exp)+'</b><span>Experience</span></div>':'')+(d.cases?'<div class="stat"><b>'+esc(d.cases)+'</b><span>Cases</span></div>':'')+'</div>'
   +'<div class="actions"><a class="btn f" href="contact.html">Book appointment</a><a class="btn" href="doctors.html">← All doctors</a></div>';
  if(d.special&&d.special.length) html+='<div class="box"><h3>Specialties</h3><div class="tags">'+d.special.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div></div>';
  if(d.procs&&d.procs.length) html+='<div class="box"><h3>Procedures</h3><ul>'+d.procs.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  if(d.about) html+='<div class="box"><h3>About</h3><p>'+esc(d.about)+'</p></div>';
  if(d.experience) html+='<div class="box"><h3>Experience</h3><p>'+esc(d.experience)+'</p></div>';
  if(d.languages) html+='<div class="box"><h3>Languages</h3><p>'+esc(d.languages)+'</p></div>';
  html+='</div>';
  m.innerHTML=html;
  if(d.photo){
    var img=new Image();
    img.alt=d.name;
    img.onload=function(){var ph=document.getElementById('ph');ph.textContent='';ph.appendChild(img)};
    img.src=d.photo;
  }
})();
</script>
</body>
</html>
